var lang=new URLSearchParams(location.search).get('lang')==='es'?'es':'en';
var P={en:{trick:"Trick",topic:"Topic",role:"Role",cit:"Citizen",citDo:"Say what you really think about the topic. Then catch the Guru.",guru:"Guru",guruIs:"Your trick is number",guruDo:"Slip it into what you say. Don't say its name. Not too obvious, not too hidden.",
 slot:"Trick number",slotBk:"Put a trick card under each number.",what:"What it is",where:"Where you see it",ask:"Ask the table",q:"Who wins if I believe this?",qBk:"The Question",qDo:"Once per round. Grab this card first and ask it to anyone. They have to answer.",
 sheet:"Cut along the grey lines. Print double-sided, flip on the long edge.",front:"front",back:"back",

 idea:"One of you is secretly the Guru, slipping a trick into the conversation. Everyone else has to catch who it is and name the trick.",
 setupH:"Set up",setup:["Put the number cards 1 to 5 in a row. Shuffle the trick cards and put one under each number, name side up. Read the five tricks out loud.","Shuffle the topic cards. Put the Question card in the middle of the table.","Give everyone a line on the score sheet."],
 roundH:"A round",round:["<b>Topic.</b> Whoever has the fewest points draws two topics, picks one and reads it out. (First round: the youngest.) That player will speak first.","<b>Roles.</b> Take one Citizen card per player, minus one. Shuffle the five Guru cards face down and add one without looking. Shuffle and deal one card each. Look at yours in secret. The Guru's card has a number: that's the trick to use.","<b>Talk.</b> Going round, everyone says one or two sentences about the topic. Citizens say what they really think. The Guru slips the trick in, without saying its name or reading the card. With three players, go round twice.","<b>The Question.</b> Once per round, whoever grabs the Question card first asks anyone: “Who wins if I believe this?” They have to answer.","<b>Vote.</b> Count “three, two, one, fool!” All at once: one hand points at the Guru, the other shows the trick number with fingers. The Guru bluffs along. Hold still.","<b>Reveal.</b> The Guru shows the role card. Flip the trick card, read the back out loud and answer its question together.","<b>Next.</b> Write down the points. Put the used trick at the bottom of the deck and a new one in its place. Read it out loud."],
 scoreH:"Scoring",score:["<b>Right trick: 2 points</b>, even if you pointed at the wrong person.","<b>Right person: 1 point.</b>","<b>The Guru: 2 points</b> only if some players name the trick, but not all. Too obvious (everyone) or too hidden (nobody): 0."],
 endH:"Winning",end:"Play five rounds (three on a busy night). Most points wins. On a tie, whoever named more tricks.",

 weekH:"Week mode (optional)",week:"On Monday everyone draws a secret trick card. Slip it into a normal conversation during the week. If someone catches you and names it, they score 2. A wrong accusation gives 1 point to the accused. If you used it and nobody caught it by Sunday dinner, tell the table when: you score 2.",
 testH:"For the playtest",test:"Tell us: which rule was confusing? Which card? Did anyone ask to play again?",
 scoreSheet:"Score sheet",player:"Player",total:"Total",albumSheet:"Trick album: tick the tricks each player has named",r:"R"},
es:{trick:"Truco",topic:"Tema",role:"Papel",cit:"Ciudadano",citDo:"Di lo que piensas de verdad sobre el tema. Luego, pilla al Gurú.",guru:"Gurú",guruIs:"Tu truco es el número",guruDo:"Mételo en lo que digas. Sin decir su nombre. Ni muy evidente ni muy escondido.",
 slot:"Truco número",slotBk:"Poned una carta de truco debajo de cada número.",what:"Qué es",where:"Dónde lo ves",ask:"Pregunta para la mesa",q:"¿Y quién gana si me lo creo?",qBk:"La pregunta",qDo:"Una vez por ronda. El primero que coge esta carta se la hace a quien quiera. Hay que contestar.",

 roundH:"Una ronda",round:["<b>El tema.</b> El que va último en puntos roba dos temas, elige uno y lo lee. (Primera ronda: el más joven.) Ese jugador hablará primero.","<b>Los papeles.</b> Coged una carta de Ciudadano por jugador, menos una. Barajad las cinco de Gurú boca abajo y añadid una sin mirarla. Barajad y repartid una a cada uno. Cada uno mira la suya en secreto. La del Gurú lleva un número: ese es el truco que tiene que usar.","<b>Se habla.</b> Por orden, cada uno dice una o dos frases sobre el tema. Los Ciudadanos dicen lo que piensan de verdad. El Gurú mete su truco, sin decir el nombre ni leer la carta. Si sois tres, dad dos vueltas.","<b>La pregunta.</b> Una vez por ronda, el primero que coge la carta de la pregunta se la hace a quien quiera: «¿Y quién gana si me lo creo?». Hay que contestar.","<b>El voto.</b> Contad «tres, dos, uno, ¡pillado!». Todos a la vez: una mano señala al Gurú y la otra marca con los dedos el número del truco. El Gurú disimula y vota también. Quietos.","<b>El destape.</b> El Gurú enseña su papel. Se da la vuelta a la carta del truco, se lee el dorso en voz alta y se contesta su pregunta entre todos.","<b>Siguiente.</b> Apuntad los puntos. El truco usado va al fondo del mazo y entra uno nuevo en su sitio. Leedlo en voz alta."],
 scoreH:"Los puntos",score:["<b>Acertar el truco: 2 puntos</b>, aunque señales a quien no era.","<b>Acertar la persona: 1 punto.</b>","<b>El Gurú: 2 puntos</b> solo si algunos nombran el truco, pero no todos. Demasiado evidente (todos) o demasiado escondido (nadie): 0."],
 endH:"Quién gana",end:"Se juegan cinco rondas (tres si hay prisa). Gana quien tenga más puntos. Si hay empate, quien haya nombrado más trucos.",
 albumH:"El álbum de trucos",album:"La primera vez que nombras un truco, lo marcas en tu álbum. Con los 25, eres Inmune.",
 houseH:"Reglas de la casa",house:["Lo que dice un Ciudadano es su opinión de verdad. Nadie se lo echa en cara después.","Cualquiera puede decir «Pausa» si un tema toca algo real. Se para y se habla. Es la mejor jugada del juego.","El Gurú puede decir cosas que no piensa. Es su trabajo."],
 weekH:"Modo semana (opcional)",week:"El lunes cada uno roba un truco en secreto. Hay que meterlo en una conversación normal durante la semana. Si alguien te pilla y lo nombra, gana 2. Una acusación fallida da 1 punto al acusado. Si lo usaste y nadie te pilló antes de la cena del domingo, cuenta cuándo: ganas 2.",
 testH:"Para la prueba",test:"Contadnos: ¿qué regla lió? ¿Qué carta? ¿Alguien pidió volver a jugar?",
 scoreSheet:"Hoja de puntos",player:"Jugador",total:"Total",albumSheet:"Álbum de trucos: marcad los trucos que ha nombrado cada uno",r:"R"}}[lang];

for(var i=1;i<=5;i++)cards.push({f:'<div class="c mid"><span class="p">'+P.slot+'</span><span class="huge">'+i+'</span></div>',b:'<div class="c mid"><span class="huge">'+i+'</span><span class="p">'+P.slotBk+'</span></div>'});

 b:'<div class="c"><span class="strip" style="background:'+th.color+'"></span><span class="k"><span>'+P.trick+' '+t.id+'</span><span>'+e(x.name)+'</span></span><div><div class="l">'+P.what+'</div><div class="p">'+e(x.what)+'</div></div><div><div class="l">'+P.where+'</div><div class="p">'+e(x.where)+'</div></div><div class="ask"><div class="l" style="color:#000;font-weight:400">'+P.ask+'</div>'+e(x.ask)+'</div></div>'})});
FMO.topics.forEach(function(t){var th=FMO.themes[t.theme];
 cards.push({f:'<div class="c"><span class="strip" style="background:'+th.color+'"></span><span class="k"><span>'+P.topic+'</span><span>'+e(th[lang])+'</span></span><span class="q">'+e(t[lang])+'</span>'+LOGO+'</div>',b:bk(P.topic)})});
var h='';
h+='<div class="page doc"><h1>Fool Me Once.</h1><p>'+P.sub+'</p><p class="box"><b>'+P.idea+'</b></p><div class="cols"><div><h2>'+P.setupH+'</h2><ol>'+P.setup.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol><h2>'+P.roundH+'</h2><ol>'+P.round.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol></div><div><h2>'+P.scoreH+'</h2><ul>'+P.score.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><h2>'+P.endH+'</h2><p>'+P.end+'</p><h2>'+P.albumH+'</h2><p>'+P.album+'</p><h2>'+P.houseH+'</h2><ul>'+P.house.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><h2>'+P.weekH+'</h2><p>'+P.week+'</p><h2>'+P.testH+'</h2><p class="box">'+P.test+'</p></div></div></div>';
var cols='<th class="x"></th><th class="x"></th><th class="x"></th><th class="x"></th><th class="x"></th><th class="x"></th>';
h+='<div class="page doc"><h2 style="margin-top:0">'+P.scoreSheet+'</h2><table><tr><th>'+P.player+'</th>'+[1,2,3,4,5].map(function(i){return '<th class="x">'+P.r+i+'</th>'}).join('')+'<th class="x">'+P.total+'</th></tr>'+[1,2,3,4,5,6].map(function(){return '<tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>'}).join('')+'</table><h2>'+P.albumSheet+'</h2><table><tr><th>'+P.trick+'</th>'+cols+'</tr>'+FMO.tricks.map(function(t){return '<tr><td>'+t.id+'. '+e(t[lang].name)+'</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>'}).join('')+'</table></div>';
for(var s=0;s<cards.length;s+=9){var set=cards.slice(s,s+9),n=s/9+1;
 h+='<div class="page"><div class="foot">Fool Me Once · '+n+'/9 · '+P.front+' · '+P.sheet+'</div><div class="grid">'+set.map(function(c){return c.f}).join('')+'</div></div>';
 var m=[];for(var r=0;r<3;r++){var row=set.slice(r*3,r*3+3);while(row.length<3)row.push({b:'<div></div>'});m=m.concat(row.reverse())}
 h+='<div class="page"><div class="foot">Fool Me Once · '+n+'/9 · '+P.back+'</div><div class="grid">'+m.map(function(c){return c.b}).join('')+'</div></div>';}

window.OVER=[].filter.call(document.querySelectorAll('.c,.doc'),function(el){return el.scrollHeight>el.clientHeight+1}).map(function(el){return el.textContent.slice(0,40)});
