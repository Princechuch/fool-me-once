<!doctype html>
<html><head><meta charset="utf-8"><title>Fool Me Once · print and play</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;page-break-after:always;position:relative;overflow:hidden}

.c .s{font-size:10.5pt;font-style:italic;line-height:1.25}

.c .list b{display:inline-block;width:4.5mm}
.doc{padding:13mm 15mm;font-size:10pt;line-height:1.36}

.doc h2{font-size:12.5pt;margin:4mm 0 1.3mm}
.doc p{margin:0 0 1.6mm}
.doc ol,.doc ul{margin:0;padding-left:5.5mm}
.doc li{margin-bottom:1.1mm}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.box{border:.4mm solid #000;border-radius:2mm;padding:3mm 4mm}
table{border-collapse:collapse;width:100%;font-size:9pt}
td,th{border:.2mm solid #000;padding:1mm 1.5mm;text-align:left;height:6mm}
th{font-size:8pt}
td.x,th.x{width:15mm}
</style></head><body><script src="cards.js"></script><script src="extra.js"></script><script>

 gScore:["<b>Right trick: 2 points</b>, even if you pointed at the wrong person.","<b>Right person: 1 point.</b>","<b>The Guru: 2 points</b> if some players name the trick, but not all.","<b>Nobody named it?</b> The Guru says the sentence where they used it, and the table votes with thumbs. Really there: <b>1 point</b>. Not there: 0.","<b>Everyone named it:</b> too obvious, 0."],

 gH:"The Guru · de 3 a 6 jugadores · desde 14 años · unos 6 minutos por ronda",

 gRound:["<b>El tema.</b> El que va último en puntos roba dos temas, elige uno y habla primero. Primera ronda: el más joven.","<b>El reparto.</b> Coged una carta de papel por jugador: el Gurú y el resto Ciudadanos. Barajad y repartid una a cada uno, boca abajo. Barajad los 8 trucos del pack y repartid uno a cada uno, boca abajo. Cada uno mira las dos en secreto. Nadie enseña sus cartas.","<b>Se habla.</b> Por orden, una o dos frases cada uno. Los Ciudadanos dicen lo que piensan de verdad. El Gurú mete su truco sin decir su nombre.","<b>Debate, dos minutos.</b> Se pregunta lo que se quiera. Cada Ciudadano sabe que su carta de truco no es la del Gurú: puede decir cuál tiene, o farolear. El primero que coge la carta de la pregunta se la hace a quien quiera: «¿Y quién gana si me lo creo?». Una vez por ronda.","<b>¿Otra vuelta?</b> Si la mayoría quiere, una frase más cada uno. Una vez por ronda.","<b>El voto.</b> Contad «tres, dos, uno, ¡pillado!». Todos a la vez: una mano señala al Gurú y la otra marca el número del truco. El Gurú disimula y vota también.","<b>El destape.</b> El Gurú da la vuelta a sus dos cartas. Se lee en voz alta el dorso del truco y se contesta su pregunta entre todos."],
 gScore:["<b>Acertar el truco: 2 puntos</b>, aunque señales a quien no era.","<b>Acertar la persona: 1 punto.</b>","<b>El Gurú: 2 puntos</b> si algunos nombran el truco, pero no todos.","<b>¿No lo ha nombrado nadie?</b> El Gurú dice la frase donde lo metió y la mesa vota con el pulgar. Si estaba: <b>1 punto</b>. Si no: 0.","<b>Si lo nombran todos:</b> demasiado evidente, 0."],

function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var LOGO='<span class="logo">Fool Me Once.</span>';
function bk(label,inv){return '<div class="c mid'+(inv?' inv':'')+'"><span class="bk">Fool Me<br>Once.</span><span class="p">'+label+'</span></div>'}
function packOf(id){for(var i=0;i<E.packs.length;i++){var j=E.packs[i].ids.indexOf(id);if(j>=0)return {p:i+1,n:j+1}}}
var cards=[];
cards.push({f:'<div class="c inv"><span class="k"><span>'+P.role+'</span></span><span class="t" style="margin-top:6mm;color:#FFE600">'+P.guru+'</span><span class="p" style="font-size:11pt">'+P.guruDo+'</span>'+LOGO+'</div>',b:bk(P.role,1)});
for(var i=0;i<5;i++)cards.push({f:'<div class="c"><span class="k"><span>'+P.role+'</span></span><span class="t" style="margin-top:6mm">'+P.cit+'</span><span class="p" style="font-size:11pt">'+P.citDo+'</span><span class="p">'+P.citTrick+'</span>'+LOGO+'</div>',b:bk(P.role,1)});
cards.push({f:'<div class="c mid inv"><span class="q" style="font-size:20pt">'+P.q+'</span></div>',b:'<div class="c mid"><span class="bk">'+P.qBk+'</span><span class="p">'+P.qDo+'</span></div>'});
E.packs.forEach(function(pk){cards.push({f:'<div class="c"><span class="k"><span>'+e(pk[lang])+'</span></span><ul class="list" style="margin-top:3mm">'+pk.ids.map(function(id,i){return '<li><b>'+(i+1)+'</b>'+e(FMO.tricks[id-1][lang].name)+'</li>'}).join('')+'</ul>'+LOGO+'</div>',b:bk(P.packBk+' '+pk.id)})});
E.packs.forEach(function(pk){pk.ids.forEach(function(id,i){var t=FMO.tricks[id-1],x=t[lang],m=E.more[id][lang],th=FMO.themes[t.theme];
 cards.push({f:'<div class="c"><span class="strip" style="background:'+th.color+'"></span><span class="k"><span>Pack '+pk.id+'</span><span>'+e(th[lang])+'</span></span><div style="display:flex;gap:2.5mm;align-items:baseline"><span class="n" style="font-size:22pt">'+(i+1)+'</span><span class="t" style="font-size:13.5pt">'+e(x.name)+'</span></div><div class="sm">'+e(x.what)+'</div><div><div class="l">'+P.sounds+'</div><ul class="ex">'+m.ex.map(function(z){return '<li>“'+e(z)+'”</li>'}).join('')+'</ul></div><div class="not"><b>'+P.not+':</b> '+e(m.not)+'</div><div class="ask"><div class="l" style="color:#000;font-weight:400">'+P.ask+'</div>'+e(x.ask)+'</div></div>',
 b:bk(P.packBk+' '+pk.id)})})});
FMO.topics.forEach(function(t){var th=FMO.themes[t.theme];cards.push({f:'<div class="c"><span class="strip" style="background:'+th.color+'"></span><span class="k"><span>'+P.topic+'</span><span>'+e(th[lang])+'</span></span><span class="q">'+e(t[lang])+'</span>'+LOGO+'</div>',b:bk(P.topic)})});
E.pitch.products.forEach(function(t){cards.push({f:'<div class="c"><span class="strip" style="background:#FF3B30"></span><span class="k"><span>'+P.prod+'</span><span>The Pitch</span></span><span class="q">'+e(t[lang])+'</span>'+LOGO+'</div>',b:bk(P.prod)})});
E.pitch.home.forEach(function(t){cards.push({f:'<div class="c"><span class="strip" style="background:#FF3B30"></span><span class="k"><span>'+P.home+'</span><span>The Pitch</span></span><span class="q">'+e(t[lang])+'</span>'+LOGO+'</div>',b:bk(P.prod)})});

var h='';
function ol(a){return '<ol>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>'}
function ul(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}
h+='<div class="page doc"><h1>'+P.title+'</h1><p>'+P.sub+'</p><p>'+P.kit+'</p><h2>'+P.gH+'</h2><p class="box"><b>'+P.gIdea+'</b></p><div class="cols"><div><p>'+P.gSet+'</p>'+ol(P.gRound)+'</div><div>'+ul(P.gScore)+'<p style="margin-top:2mm">'+P.gEnd+'</p><h2>'+P.houseH+'</h2>'+ul(P.house)+'<h2>'+P.testH+'</h2><p class="box">'+P.test+'</p></div></div></div>';
h+='<div class="page doc"><h2 style="margin-top:0">'+P.pH+'</h2><p class="box"><b>'+P.pIdea+'</b></p><div class="cols"><div><p>'+P.pSet+'</p>'+ol(P.pRound)+'</div><div>'+ul(P.pScore)+'<p style="margin-top:2mm">'+P.pEnd+'</p></div></div>';
var cols='';for(var i=0;i<8;i++)cols+='<th class="x"></th>';
h+='<h2>'+P.scoreSheet+'</h2><table><tr><th>'+P.player+'</th>'+[1,2,3,4,5,6,7,8].map(function(i){return '<th class="x">'+P.r+i+'</th>'}).join('')+'<th class="x">'+P.total+'</th></tr>'+[1,2,3,4,5,6,7,8].map(function(){return '<tr><td></td>'+'<td></td>'.repeat(9)+'</tr>'}).join('')+'</table></div>';
h+='<div class="page doc"><h2 style="margin-top:0">'+P.albumSheet+'</h2><table><tr><th>'+P.trick+'</th>'+cols+'</tr>'+E.packs.flatMap(function(pk){return pk.ids.map(function(id,i){return '<tr><td>Pack '+pk.id+' · '+(i+1)+'. '+e(FMO.tricks[id-1][lang].name)+'</td>'+'<td></td>'.repeat(8)+'</tr>'})}).join('')+'</table></div>';
var sheets=Math.ceil(cards.length/9);
for(var s=0;s<cards.length;s+=9){var set=cards.slice(s,s+9),n=s/9+1;
 h+='<div class="page"><div class="foot">Fool Me Once · '+n+'/'+sheets+' · '+P.front+' · '+P.sheet+'</div><div class="grid">'+set.map(function(c){return c.f}).join('')+'</div></div>';
 var m=[];for(var r=0;r<3;r++){var row=set.slice(r*3,r*3+3);while(row.length<3)row.push({b:'<div></div>'});m=m.concat(row.reverse())}
 h+='<div class="page"><div class="foot">Fool Me Once · '+n+'/'+sheets+' · '+P.back+'</div><div class="grid">'+m.map(function(c){return c.b}).join('')+'</div></div>';}

window.OVER=[].filter.call(document.querySelectorAll('.c,.doc'),function(el){return el.scrollHeight>el.clientHeight+1}).map(function(el){return el.textContent.slice(0,50)});
</script></body></html>
