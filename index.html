<style>
:root{--paper:#EEF1F5;--white:#fff;--ink:#141A33;--muted:#56607A;--line:#CDD3DF;--hi:#FFE600;--red:#FF3B30;--ok:#2F9E6E;
--display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;--body:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:18px/1.45 var(--body);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
h1,h2,h3,.disp{font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(2.6rem,13vw,4.2rem)}
h2{font-size:clamp(1.8rem,8vw,2.6rem)}
h3{font-size:1.25rem}
#app{min-height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
 padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;margin-bottom:14px}
.logo{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em;background:none;border:0;padding:0}
.logo i{font-style:normal;color:var(--red)}
.pill{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem}
.pill.on{background:var(--ink);color:var(--paper)}
.round{font-weight:700;font-size:.9rem;color:var(--muted)}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grow{flex:1}
.sub{color:var(--muted);font-size:1.05rem;max-width:34ch}
.hl{background:linear-gradient(transparent 14%,var(--hi) 14%,var(--hi) 90%,transparent 90%);padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone;color:#141A33}
.paint{background:linear-gradient(var(--hi),var(--hi)) no-repeat 0 62%/0% 78%;padding:0 .1em;box-decoration-break:clone;-webkit-box-decoration-break:clone;animation:paint .7s .45s cubic-bezier(.6,0,.2,1) forwards;color:#141A33}
@keyframes paint{to{background-size:100% 78%}}
.btn{display:block;width:100%;border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:16px;padding:17px 20px;font-weight:700;font-size:1.15rem;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.yellow{background:var(--hi);color:#141A33}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.small{padding:11px 14px;font-size:1rem;border-radius:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowb{display:flex;gap:10px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* cards */
.card{position:relative;background:var(--white);border:2px solid var(--ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:5px 6px 0 var(--ink)}
.card .band{height:10px;border-radius:5px;margin-top:auto}
.card .num{font-family:var(--display);font-weight:800;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);align-self:flex-start;padding:0 8px}
.card .kind{font-weight:700;font-size:.85rem;color:var(--muted)}
.card .name{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,8vw,2.3rem);line-height:1.02;letter-spacing:-.02em}
.card .says{font-style:italic;font-size:1.1rem}
.card.dark{background:var(--ink);color:var(--paper)}
.card.dark .kind{color:var(--hi)}
.card.big{min-height:300px;justify-content:center}
.card dl{margin:0;display:flex;flex-direction:column;gap:10px}
.card dt{font-weight:700;font-size:.85rem;color:var(--muted)}
.card dd{margin:0}
.card .ask{background:var(--hi);color:#141A33;border-radius:12px;padding:12px 14px;font-weight:700}
/* flip */
.flip{perspective:1200px}
.flip .in{position:relative;transform-style:preserve-3d;animation:flip .7s cubic-bezier(.3,.9,.3,1) both}
@keyframes flip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
/* hold to peek */
.peek{position:relative;min-height:340px;border-radius:20px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.peek .back,.peek .front{position:absolute;inset:0;border-radius:20px;border:2px solid var(--ink);box-shadow:5px 6px 0 var(--ink);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px;transition:opacity .12s}
.peek .back{background:var(--ink);color:var(--paper);align-items:center;text-align:center}
.peek .back .big{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1}
.peek .back .big span{background:var(--hi);color:#141A33;padding:0 .12em}
.peek .front{background:var(--white);opacity:0}
.peek.show .front{opacity:1}.peek.show .back{opacity:0}
.peek .front.guru{background:var(--hi);color:#141A33}

.line{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.line li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.line .n{font-family:var(--display);font-weight:800;font-size:1.2rem;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center}
.line b{font-family:var(--display);font-weight:800;font-size:1.12rem;line-height:1.1;display:block}
.line span{font-style:italic;font-size:.92rem;color:var(--muted);display:block;line-height:1.25}
.line li.hit{background:var(--hi);color:#141A33}.line li.hit span{color:#141A33}
.line li.new{animation:pop .5s ease-out}

.topic{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,7vw,2rem);line-height:1.08;letter-spacing:-.02em}

.pick{text-align:left;background:var(--white);border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:4px 5px 0 var(--ink);display:flex;flex-direction:column;gap:10px}

.names{display:flex;flex-direction:column;gap:8px}
.names label{display:grid;grid-template-columns:34px minmax(0,1fr) 40px;gap:8px;align-items:center}
.names .i{font-family:var(--display);font-weight:800;color:var(--muted);text-align:center}
.names input{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:var(--white);color:var(--ink);width:100%;min-width:0}
.names .x{border:0;background:none;font-size:1.4rem;color:var(--muted);height:40px}
.seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--paper)}

.count{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:38vw;line-height:1}

.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:8px 8px 8px 14px}
.trow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tog{border:2px solid var(--ink);background:transparent;border-radius:10px;padding:9px 10px;font-weight:700;font-size:.88rem;min-width:74px}
.tog.on{background:var(--ok);border-color:var(--ok);color:#fff}
.scores{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:baseline;border-bottom:2px solid var(--line);padding:8px 2px}
.srow b{font-family:var(--display);font-size:1.25rem}
.srow .d{font-weight:700;color:var(--ok)}
.srow .t{font-family:var(--display);font-weight:800;font-size:1.6rem;min-width:2ch;text-align:right}
.srow.lead b{background:linear-gradient(transparent 14%,var(--hi) 14%,var(--hi) 90%,transparent 90%);color:#141A33;padding:0 .1em;justify-self:start}
.verdict{border-radius:16px;padding:14px 16px;background:var(--ink);color:var(--paper)}
.verdict b{font-family:var(--display);font-size:1.3rem;display:block}
.stamp{align-self:flex-start;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--red);border:4px solid var(--red);border-radius:10px;padding:2px 12px;transform:rotate(-6deg);animation:stamp .35s .9s cubic-bezier(.2,2,.4,1) both}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.4);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
/* album */
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.album div{aspect-ratio:1;border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:var(--line)}
.album div.got{background:var(--hi);border-color:var(--ink);color:#141A33}
.rules{display:flex;flex-direction:column;gap:14px;counter-reset:r;list-style:none;padding:0;margin:0}
.rules li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;counter-increment:r}
.rules li::before{content:counter(r);font-family:var(--display);font-weight:800;font-size:1.2rem;width:40px;height:40px;border-radius:50%;background:var(--hi);color:#141A33;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
.rules b{font-family:var(--display);font-size:1.15rem;display:block}
.note{background:var(--white);border:2px dashed var(--ink);border-radius:14px;padding:12px 14px;font-size:.98rem}
.hero-cards{position:relative;height:210px;margin:6px 0}
.hero-cards .card{position:absolute;width:31%;height:190px;padding:12px;gap:6px;box-shadow:3px 4px 0 var(--ink);border-radius:16px}
.hero-cards .card .name{font-size:clamp(.95rem,4.6vw,1.25rem)}
.hero-cards .card .num{min-width:28px;height:28px;font-size:.9rem}
.hero-cards .a{left:0;top:12px;transform:rotate(-6deg)}
.hero-cards .b{left:34.5%;top:0;z-index:2;animation:wig 5s 1.2s ease-in-out infinite}
.hero-cards .c{right:0;top:12px;transform:rotate(6deg)}
@keyframes wig{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-3deg)}94%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style>
